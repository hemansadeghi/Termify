name: sentinel

on:
  push:
    paths:
      - "README.md"
      - "termify-sentinel.sh"
      - ".github/workflows/sentinel.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n termify-sentinel.sh

      - name: Run Termify Sentinel (GitHub repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./termify-sentinel.sh --github-only --jobs 6

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-report
          path: deprecated_termify.txt
